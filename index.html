<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>SUNGWOO KASA 모바일 조회</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;color:#111827;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:0 auto;padding:14px 12px 40px}.head{background:#172033;color:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px #0f172a22}.head h1{font-size:20px;margin:0}.head p{font-size:12px;color:#cbd5e1;margin:6px 0 0}.card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 3px 12px #0f172a0d}.row{display:flex;gap:8px}.row>*{min-width:0}.grow{flex:1}input,button{font:inherit;border-radius:10px}input{width:100%;padding:13px;border:1px solid #aeb9c8;background:#fff;font-size:16px}button{border:0;padding:12px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#475569}.light{background:#e8edf4;color:#111827}.status{font-size:13px;padding:11px 12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-top:10px;white-space:pre-wrap}.status.bad{background:#fef2f2;color:#b91c1c}.status.ok{background:#f0fdf4;color:#166534}.muted{font-size:12px;color:#64748b;line-height:1.55}.hidden{display:none}.plate{font-size:30px;font-weight:900;letter-spacing:.5px}.car{font-size:22px;font-weight:850;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.kv{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px}.kv small{display:block;color:#64748b;margin-bottom:4px}.kv b{font-size:15px}.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.price{padding:14px;border-radius:12px}.price.steel{background:#eff6ff;border:1px solid #bfdbfe}.price.alloy{background:#ecfdf5;border:1px solid #bbf7d0}.price small{display:block;margin-bottom:4px}.price strong{font-size:25px}.cand{padding:9px 0;border-top:1px dashed #dbe3ee}.settings summary{font-weight:800;cursor:pointer}.settings label{display:block;font-size:12px;color:#475569;margin-top:10px}.settings input{margin-top:4px;font-size:14px;padding:10px}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>SUNGWOO KASA 모바일 조회</h1><p>차량번호 입력 → 사무실 PC KASA 자동조회 → 가격 반환</p></div>
<div class="card"><div class="row"><input id="plate" class="grow" placeholder="차량번호 예: 24도5843" autocomplete="off"><button id="lookup">조회</button></div><div id="lookupStatus" class="status">중계 서버 설정 후 차량번호를 입력하세요.</div></div>
<div id="result" class="card hidden"></div>
<details class="card settings" open><summary>연결 설정</summary><label>중계 서버 URL<input id="apiUrl" placeholder="https://sungwoo-kasa-relay....workers.dev"></label><label>연결 키<input id="apiKey" type="password" placeholder="PC 확장프로그램과 같은 연결 키"></label><div class="row" style="margin-top:10px"><button id="saveSettings" class="light grow">설정 저장</button><button id="testApi" class="secondary grow">연결 테스트</button></div><div class="muted" style="margin-top:10px">Dropbox는 사용하지 않습니다. 이 설정은 이 휴대폰 브라우저에만 저장됩니다.</div></details>
</div>
<script>
(()=>{
const STORE='sw_kasa_relay_v050';const $=s=>document.querySelector(s);const sleep=ms=>new Promise(r=>setTimeout(r,ms));let pollToken=0;
function load(){let s={};try{s=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(_){}return s}
function save(v){const s={...load(),...v};localStorage.setItem(STORE,JSON.stringify(s));return s}
function cleanUrl(v){return String(v||'').trim().replace(/\/+$/,'')}
function settings(){const s=load();return{apiUrl:cleanUrl($('#apiUrl').value||s.apiUrl),apiKey:String($('#apiKey').value||s.apiKey||'').trim()}}
function setStatus(msg,type=''){const el=$('#lookupStatus');el.textContent=msg;el.className='status'+(type?' '+type:'')}
async function api(path,opt={}){const s=settings();if(!s.apiUrl)throw new Error('중계 서버 URL을 입력하세요.');if(!/^https:\/\//i.test(s.apiUrl))throw new Error('https:// 주소를 입력하세요.');if(!s.apiKey)throw new Error('연결 키를 입력하세요.');const h=new Headers(opt.headers||{});h.set('X-KASA-Key',s.apiKey);if(opt.body!=null&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(s.apiUrl+path,{...opt,headers:h,cache:'no-store'});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch(_){d={raw}}if(!r.ok){const e=new Error(d.error||d.message||raw||`HTTP ${r.status}`);e.status=r.status;throw e}return d}
function priceParts(raw){let m=String(raw||'').match(/^\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*(~)?\s*$/);if(m)return{steel:m[1],alloy:m[2],open:!!m[3]};m=String(raw||'').match(/^\s*(\d+(?:\.\d+)?)\s*(~)?\s*$/);if(m)return{steel:m[1],alloy:m[1],open:!!m[2]};return null}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(d){if(d.status!=='ok'){setStatus('조회 실패 · '+(d.error||'알 수 없는 오류'),'bad');return}const v=d.vehicle||{},cs=Array.isArray(d.priceCandidates)?d.priceCandidates:[],first=cs[0],p=first?priceParts(first.price):null;const steel=p?`${p.steel}만원${p.open?' 이상':''}`:'-',alloy=p?`${p.alloy}만원${p.open?' 이상':''}`:'-';$('#result').innerHTML=`<div class="plate">${esc(v['등록번호']||d.plate||'-')}</div><div class="car">${esc(v['차명']||'차명 없음')}</div><div class="grid"><div class="kv"><small>연식</small><b>${esc(v['연식']||'-')}</b></div><div class="kv"><small>주행거리</small><b>${esc(v['주행거리']||'-')}</b></div><div class="kv"><small>연료</small><b>${esc(v['연료']||'-')}</b></div><div class="kv"><small>엔진</small><b>${esc(v['원동기형식']||'-')}</b></div></div><div class="muted" style="margin-top:10px">VIN ${esc(v['차대번호']||'-')} · ${esc(v['색상']||'')}</div><div style="font-weight:850;margin-top:16px">${first?esc((first.variants||[]).join(' · ')):'가격표 후보 없음'}</div><div class="prices"><div class="price steel"><small>철휠</small><strong>${esc(steel)}</strong></div><div class="price alloy"><small>알루미늄휠</small><strong>${esc(alloy)}</strong></div></div>${cs.slice(1,5).map((x,i)=>{const q=priceParts(x.price);return `<div class="cand"><b>${i+2}. ${esc((x.variants||[]).join(' · '))}</b><div class="muted">${q?`철 ${esc(q.steel)} / 알루미늄 ${esc(q.alloy)}만원`:esc(x.price||'-')}</div></div>`}).join('')}`;$('#result').classList.remove('hidden');setStatus('조회 완료 · PC KASA 결과를 받았습니다.','ok')}
async function test(){try{const f=settings();save(f);setStatus('중계 서버 연결 확인 중…');const d=await api('/health',{method:'GET'});setStatus(`연결 성공 · ${d.service||'SUNGWOO KASA Relay'}`,'ok')}catch(e){setStatus('연결 실패 · '+String(e.message||e),'bad')}}
async function lookup(){const plate=$('#plate').value.replace(/\s+/g,'').trim();if(!plate)return setStatus('차량번호를 입력하세요.','bad');const f=settings();save(f);const my=++pollToken;$('#result').classList.add('hidden');try{setStatus('사무실 PC로 조회 요청 전송 중…');const r=await api('/request',{method:'POST',body:JSON.stringify({plate,source:'github-mobile-v0.5.0'})});const id=String(r.requestId||'');if(!id)throw new Error('서버에서 requestId를 받지 못했습니다.');setStatus('PC KASA 조회 대기 중…');const started=Date.now();while(my===pollToken&&Date.now()-started<90000){await sleep(1500);try{const q=await api('/result?id='+encodeURIComponent(id),{method:'GET'});if(q?.pending)continue;if(q?.result){render(q.result);return}}catch(e){if(e.status===404)continue;throw e}}if(my===pollToken)setStatus('90초 동안 응답이 없습니다. 사무실 PC에서 KASA 페이지가 열려 있는지 확인하세요.','bad')}catch(e){setStatus(String(e.message||e),'bad')}}
const s=load();$('#apiUrl').value=s.apiUrl||'';$('#apiKey').value=s.apiKey||'';if(s.apiUrl&&s.apiKey)setStatus('연결 설정됨 · 차량번호를 입력하세요.','ok');$('#saveSettings').onclick=()=>{const f=settings();save(f);setStatus('설정을 저장했습니다.','ok')};$('#testApi').onclick=test;$('#lookup').onclick=lookup;$('#plate').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
})();
</script></body></html>
