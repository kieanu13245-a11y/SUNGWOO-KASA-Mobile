<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>SUNGWOO KASA 모바일 조회</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;color:#111827;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:0 auto;padding:14px 12px 40px}.head{background:#172033;color:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px #0f172a22}.head h1{font-size:20px;margin:0}.head p{font-size:12px;color:#cbd5e1;margin:6px 0 0}.card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 3px 12px #0f172a0d}.row{display:flex;gap:8px}.row>*{min-width:0}.grow{flex:1}input,button{font:inherit;border-radius:10px}input{width:100%;padding:13px;border:1px solid #aeb9c8;background:#fff;font-size:16px}button{border:0;padding:12px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#475569}.light{background:#e8edf4;color:#111827}.status{font-size:13px;padding:11px 12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-top:10px;white-space:pre-wrap}.status.bad{background:#fef2f2;color:#b91c1c}.status.ok{background:#f0fdf4;color:#166534}.muted{font-size:12px;color:#64748b;line-height:1.55}.hidden{display:none}.plate{font-size:30px;font-weight:900;letter-spacing:.5px}.car{font-size:22px;font-weight:850;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.kv{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px}.kv small{display:block;color:#64748b;margin-bottom:4px}.kv b{font-size:15px}.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.price{padding:14px;border-radius:12px}.price.steel{background:#eff6ff;border:1px solid #bfdbfe}.price.alloy{background:#ecfdf5;border:1px solid #bbf7d0}.price small{display:block;margin-bottom:4px}.price strong{font-size:25px}.cand{padding:9px 0;border-top:1px dashed #dbe3ee}.server-row,.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:72px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#e2e8f0;color:#475569}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.busy{background:#dbeafe;color:#1d4ed8}.mini{padding:8px 10px;font-size:12px}.history-list{margin-top:8px}.history-empty{padding:14px 4px;color:#64748b;font-size:13px;text-align:center}.history-item{display:block;width:100%;text-align:left;background:#fff;color:#111827;border:0;border-top:1px solid #edf1f5;border-radius:0;padding:11px 2px;font-weight:400}.history-item:first-child{border-top:0}.history-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.history-plate{font-size:17px;font-weight:900}.history-time{font-size:12px;color:#64748b}.history-car{font-size:13px;font-weight:750;margin-top:3px}.history-price{font-size:12px;color:#475569;margin-top:3px}
.pc-head{margin-top:16px}.pc-title{font-size:18px;font-weight:900;line-height:1.25}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.tag{font-size:11px;font-weight:850;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}.tag.gray{background:#f1f5f9;color:#475569}
.pricebox{margin-top:12px;border-radius:14px;padding:15px;background:linear-gradient(135deg,#eff6ff,#f8fbff);border:1px solid #bfdbfe}.price-title{font-size:12px;color:#1d4ed8;font-weight:900}.price-main{font-size:30px;font-weight:950;letter-spacing:-.6px;margin-top:3px}.price-main.warn{font-size:24px;color:#92400e}.wheels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.wheel{background:#fff;border:1px solid #dbeafe;border-radius:11px;padding:10px}.wheel small{display:block;color:#64748b;margin-bottom:2px}.wheel b{font-size:21px}.pc-section{margin-top:14px}.pc-section-title{font-size:12px;font-weight:900;color:#475569;margin-bottom:6px}.rule{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 11px;border-radius:10px;margin-top:7px;background:#f8fafc;border:1px solid #e2e8f0}.rule .k{font-size:13px;font-weight:800;line-height:1.35}.rule .v{font-size:14px;font-weight:950;text-align:right;white-space:nowrap}.rule.down{background:#fff7f7;border-color:#fecaca}.rule.down .v{color:#b91c1c}.rule.up{background:#f0fdf4;border-color:#bbf7d0}.rule.up .v{color:#166534}.rule.special{background:#fffaf0;border-color:#fed7aa}.rule.special .v{color:#9a3412}.notice{margin-top:11px;padding:10px 11px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;font-weight:800;line-height:1.45}.compare{margin-top:9px;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}.compare-row{display:grid;grid-template-columns:1.45fr 1fr;gap:8px;padding:11px 12px;border-top:1px solid #edf1f5;align-items:center}.compare-row:first-child{border-top:0}.compare-left{font-size:13px;font-weight:800}.compare-right{text-align:right;font-size:17px;font-weight:950}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>SUNGWOO KASA 모바일 조회</h1><p>여러 명이 동시에 조회해도 순서대로 자동 처리</p></div>
<div class="card"><div class="server-row"><div><b>NAS 서버 상태</b><div id="serverDetail" class="muted" style="margin-top:3px">상태 확인 중…</div></div><span id="serverBadge" class="badge">확인 중</span></div></div>
<div class="card"><div class="row"><input id="plate" class="grow" placeholder="차량번호 예: 24도5843" autocomplete="off"><button id="lookup">조회</button></div><div id="lookupStatus" class="status">준비 완료 · 차량번호를 입력하세요.</div></div>
<div id="result" class="card hidden"></div>
<div class="card"><div class="history-head"><div><b>오늘 조회 내역</b><div id="historyMeta" class="muted" style="margin-top:3px">불러오는 중…</div></div><button id="refreshHistory" class="light mini">새로고침</button></div><div id="historyList" class="history-list"><div class="history-empty">조회 내역을 불러오는 중입니다.</div></div></div>
</div>
<script>
(()=>{
const API_URL='https://sungwoo-kasa-relay.kieanu13245.workers.dev';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let pollToken=0;
let historyItems=[];
function setStatus(msg,type=''){const el=$('#lookupStatus');el.textContent=msg;el.className='status'+(type?' '+type:'')}
function todayKst(){return new Date(Date.now()+9*60*60*1000).toISOString().slice(0,10)}
function fmtKst(iso){const d=new Date(iso);if(!Number.isFinite(d.getTime()))return '-';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function setServerBadge(text,type=''){const el=$('#serverBadge');el.textContent=text;el.className='badge'+(type?' '+type:'')}
async function refreshServerStatus(){
  try{
    const s=await api('/status',{method:'GET'});
    const seen=s.lastSeenAt?fmtKst(s.lastSeenAt):'-';
    if(!s.online){
      setServerBadge('오프라인','bad');
      $('#serverDetail').textContent='NAS Agent 응답 없음 · 마지막 응답 '+seen;
      return;
    }
    if(!s.kasaReady){
      setServerBadge('로그인 필요','warn');
      $('#serverDetail').textContent='NAS 연결됨 · KASA 로그인/화면 확인 필요';
      return;
    }
    if(s.busy){
      setServerBadge('조회 중','busy');
      $('#serverDetail').textContent='NAS 정상 · '+(s.currentPlate?('현재 '+s.currentPlate+' 조회 중'):'KASA 조회 처리 중')+(Number(s.queueLength||0)>0?(' · 대기 '+s.queueLength+'건'):'');
      return;
    }
    setServerBadge('정상','ok');
    $('#serverDetail').textContent='NAS 정상 · KASA 준비 완료'+(Number(s.queueLength||0)>0?(' · 대기 '+s.queueLength+'건'):'');
  }catch(e){
    setServerBadge('중계 오류','bad');
    $('#serverDetail').textContent='Cloudflare 중계 상태 확인 실패';
  }
}

function priceParts(raw){
  const s=String(raw||'').trim();
  let m=s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*(~)?$/);
  if(m)return{type:'pair',steel:m[1],alloy:m[2],open:!!m[3]};
  m=s.match(/^(\d+(?:\.\d+)?)\s*~\s*(\d+(?:\.\d+)?)$/);
  if(m)return{type:'range',min:m[1],max:m[2]};
  m=s.match(/^(\d+(?:\.\d+)?)\s*(~)?$/);
  if(m)return{type:'single',value:m[1],open:!!m[2]};
  return null;
}
function moneyText(raw){
  const s=String(raw??'').trim();
  if(!s)return '';
  if(/만원/.test(s))return s;
  const p=priceParts(s);
  if(p?.type==='pair')return p.steel+' / '+p.alloy+'만원'+(p.open?'~':'');
  if(p?.type==='range')return p.min+'~'+p.max+'만원';
  if(p?.type==='single')return p.value+'만원'+(p.open?'~':'');
  if(/^[+-]\d+(?:\.\d+)?$/.test(s))return s+'만원';
  if(/^\d+(?:\.\d+)?\s*\/\s*\d+(?:\.\d+)?$/.test(s))return s+'만원';
  if(/^\d+(?:\.\d+)?$/.test(s))return s+'만원';
  return s;
}
function historyPriceText(item){
  const c=item?.priceCard || (Array.isArray(item?.priceCandidates)?item.priceCandidates[0]?.priceCard:null);
  if(c){
    if(c.price)return '가격 '+moneyText(c.price);
    const cmp=Array.isArray(c.comparison)?c.comparison:[];
    if(cmp.length)return cmp.slice(0,2).map(x=>x.label+' '+moneyText(x.value)).join(' · ');
  }
  const first=Array.isArray(item?.priceCandidates)?item.priceCandidates[0]:null;
  if(!first)return '가격표 매칭 없음';
  return '가격 '+moneyText(first.price||'');
}
function renderHistory(items){
  historyItems=Array.isArray(items)?items:[];
  $('#historyMeta').textContent='오늘 '+historyItems.length+'건';
  if(!historyItems.length){
    $('#historyList').innerHTML='<div class="history-empty">오늘 조회한 차량이 없습니다.</div>';
    return;
  }
  $('#historyList').innerHTML=historyItems.map((x,i)=>{
    const v=x.vehicle||{};
    const ok=x.status==='ok';
    return '<button class="history-item" data-hi="'+i+'"><div class="history-top"><span class="history-plate">'+esc(v['등록번호']||x.plate||'-')+'</span><span class="history-time">'+esc(fmtKst(x.completedAt))+'</span></div><div class="history-car">'+esc(v['차명']||(ok?'차명 없음':'조회 실패'))+' '+esc(v['연식']||'')+'</div><div class="history-price">'+(ok?esc(historyPriceText(x)):('오류 · '+esc(x.error||'알 수 없는 오류')))+'</div></button>';
  }).join('');
}
async function loadHistory(){
  try{
    const d=await api('/history?date='+encodeURIComponent(todayKst()),{method:'GET'});
    renderHistory(d.items||[]);
  }catch(e){
    $('#historyMeta').textContent='불러오기 실패';
    $('#historyList').innerHTML='<div class="history-empty">조회 내역을 불러오지 못했습니다.</div>';
  }
}
async function api(path,opt={}){
  const h=new Headers(opt.headers||{});
  if(opt.body!=null&&!h.has('Content-Type'))h.set('Content-Type','application/json');
  const r=await fetch(API_URL+path,{...opt,headers:h,cache:'no-store'});
  const raw=await r.text();
  let d={};
  try{d=raw?JSON.parse(raw):{}}catch(_){d={raw}}
  if(!r.ok){const e=new Error(d.error||d.message||raw||('HTTP '+r.status));e.status=r.status;throw e}
  return d;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderRules(title,rows){
  const a=Array.isArray(rows)?rows.filter(Boolean):[];
  if(!a.length)return '';
  return '<div class="pc-section"><div class="pc-section-title">'+esc(title)+'</div>'+a.map(d=>'<div class="rule '+esc(d.tone||'info')+'"><div class="k">'+esc(d.label||'')+'</div><div class="v">'+esc(moneyText(d.value||''))+'</div></div>').join('')+'</div>';
}
function legacyPriceCard(d){
  const first=Array.isArray(d?.priceCandidates)?d.priceCandidates[0]:null;
  if(!first)return null;
  const note=String(first.note||'').trim();
  return {title:(first.variants||[]).join(' · ')||'기존 가격표',price:String(first.price||''),details:note?[{label:note,value:'',tone:'info'}]:[],notice:'이전 조회 결과 · 신규 가격카드는 다시 조회하면 적용'};
}
function renderPriceCard(c){
  if(!c)return '<div class="pc-head"><div class="pc-title">가격표 매칭 없음</div></div>';
  const tags=Array.isArray(c.tags)?c.tags.filter(Boolean):[];
  let html='<div class="pc-head"><div class="pc-title">'+esc(c.title||'가격')+'</div>'+(tags.length?'<div class="tags">'+tags.map((x,i)=>'<span class="tag '+(i?'gray':'')+'">'+esc(x)+'</span>').join('')+'</div>':'')+'</div>';
  const cmp=Array.isArray(c.comparison)?c.comparison.filter(Boolean):[];
  if(cmp.length){
    html+='<div class="pc-section"><div class="pc-section-title">가격</div><div class="compare">'+cmp.map(x=>'<div class="compare-row"><div class="compare-left">'+esc(x.label||'')+'</div><div class="compare-right">'+esc(moneyText(x.value||''))+'</div></div>').join('')+'</div></div>';
  }else if(c.price){
    const p=priceParts(c.price);
    if(p?.type==='pair'){
      html+='<div class="pricebox"><div class="price-title">가격</div><div class="wheels"><div class="wheel"><small>철휠</small><b>'+esc(p.steel)+'만원'+(p.open?'~':'')+'</b></div><div class="wheel"><small>알루미늄</small><b>'+esc(p.alloy)+'만원'+(p.open?'~':'')+'</b></div></div></div>';
    }else{
      const warn=/확인 필요/.test(String(c.price));
      html+='<div class="pricebox"><div class="price-title">가격</div><div class="price-main '+(warn?'warn':'')+'">'+esc(moneyText(c.price))+'</div></div>';
    }
  }
  const details=Array.isArray(c.details)?c.details:[];
  html+=renderRules('참고 가격 / 조건',details.filter(x=>(x.tone||'info')==='info'));
  html+=renderRules('가격 조정',details.filter(x=>x.tone==='down'||x.tone==='up'));
  html+=renderRules('특수 상태',details.filter(x=>x.tone==='special'));
  if(c.notice)html+='<div class="notice">⚠ '+esc(c.notice)+'</div>';
  return html;
}
function render(d,fromHistory=false){
  if(d.status!=='ok'){setStatus('조회 실패 · '+(d.error||'알 수 없는 오류'),'bad');return}
  const v=d.vehicle||{};
  const isStarex=String(v['차명']||'').includes('스타렉스');
  const regHtml=(isStarex&&v['최초등록일'])?'<div class="kv"><small>최초등록일</small><b>'+esc(v['최초등록일'])+'</b></div>':'';
  $('#result').innerHTML='<div class="plate">'+esc(v['등록번호']||d.plate||'-')+'</div><div class="car">'+esc(v['차명']||'차명 없음')+'</div><div class="grid"><div class="kv"><small>연식</small><b>'+esc(v['연식']||'-')+'</b></div><div class="kv"><small>주행거리</small><b>'+esc(v['주행거리']||'-')+'</b></div><div class="kv"><small>연료</small><b>'+esc(v['연료']||'-')+'</b></div><div class="kv"><small>엔진</small><b>'+esc(v['원동기형식']||'-')+'</b></div>'+regHtml+'</div><div class="muted" style="margin-top:10px">VIN '+esc(v['차대번호']||'-')+' · '+esc(v['색상']||'')+'</div>'+renderPriceCard(d.priceCard||(Array.isArray(d.priceCandidates)?d.priceCandidates[0]?.priceCard:null)||legacyPriceCard(d));
  $('#result').classList.remove('hidden');
  setStatus(fromHistory?'오늘 조회 내역을 불러왔습니다.':'조회 완료 · NAS KASA 결과를 받았습니다.','ok');
}
async function lookup(){
  const plate=$('#plate').value.replace(/\s+/g,'').trim();
  if(!plate)return setStatus('차량번호를 입력하세요.','bad');
  const btn=$('#lookup');
  const my=++pollToken;
  $('#result').classList.add('hidden');
  btn.disabled=true;
  try{
    setStatus('조회 요청 전송 중…');
    const r=await api('/request',{method:'POST',body:JSON.stringify({plate,source:'github-mobile-v0.8.1'})});
    const id=String(r.requestId||'');
    if(!id)throw new Error('서버에서 requestId를 받지 못했습니다.');

    if(r.stage==='processing') setStatus('NAS KASA 조회 시작 중…');
    else if(Number(r.ahead||0)>0) setStatus(`조회 대기 중 · 앞에 ${r.ahead}건`);
    else setStatus('조회 대기 중 · 곧 시작됩니다.');

    const started=Date.now();
    while(my===pollToken&&Date.now()-started<5*60*1000){
      await sleep(1200);
      let q;
      try{
        q=await api('/result?id='+encodeURIComponent(id),{method:'GET'});
      }catch(e){
        if(e.status===404)continue;
        throw e;
      }

      if(q?.result){
        render(q.result);
        loadHistory().catch(()=>{});
        refreshServerStatus().catch(()=>{});
        return;
      }

      if(q?.pending){
        if(q.stage==='processing') setStatus('NAS KASA 조회 중…');
        else if(Number(q.ahead||0)>0) setStatus(`조회 대기 중 · 앞에 ${q.ahead}건`);
        else setStatus('조회 대기 중 · 곧 시작됩니다.');
      }
    }
    if(my===pollToken)setStatus('5분 동안 결과가 없습니다. 사무실 PC/KASA 상태를 확인하세요.','bad');
  }catch(e){
    setStatus(String(e.message||e),'bad');
  }finally{
    if(my===pollToken)btn.disabled=false;
  }
}
setStatus('준비 완료 · 차량번호를 입력하세요.','ok');
$('#lookup').onclick=lookup;
$('#plate').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
$('#refreshHistory').onclick=()=>loadHistory();
$('#historyList').addEventListener('click',e=>{const b=e.target.closest('[data-hi]');if(!b)return;const item=historyItems[Number(b.dataset.hi)];if(item){render(item,true);$('#result').scrollIntoView({behavior:'smooth',block:'start'});}});
refreshServerStatus();
loadHistory();
setInterval(refreshServerStatus,5000);
setInterval(loadHistory,30000);
})();
</script></body></html>
