<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SUNGWOO KASA 가격 UI 미리보기</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  color:#111827;background:#f3f6fa
}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:14px 12px 40px}
.head{background:#172033;color:white;border-radius:16px;padding:18px;box-shadow:0 8px 24px #0f172a22}
.head h1{font-size:20px;margin:0}
.head p{font-size:12px;color:#cbd5e1;margin:6px 0 0}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0 2px}
.tab{white-space:nowrap;border:0;border-radius:999px;padding:9px 12px;background:#e2e8f0;color:#334155;font-weight:800}
.tab.active{background:#2563eb;color:#fff}
.card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 3px 12px #0f172a0d}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:22px;font-weight:900;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}
.tag.gray{background:#f1f5f9;color:#475569}
.tag.warn{background:#fff7ed;color:#9a3412}
.label{font-size:12px;color:#64748b;font-weight:800;letter-spacing:.2px;margin-bottom:6px}
.pricebox{margin-top:14px;border-radius:14px;padding:16px;background:linear-gradient(135deg,#eff6ff,#f8fbff);border:1px solid #bfdbfe}
.price-title{font-size:13px;color:#1d4ed8;font-weight:900}
.price-main{font-size:32px;font-weight:950;letter-spacing:-.8px;margin-top:3px}
.price-main small{font-size:15px;font-weight:800;color:#475569}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wheel{background:#fff;border:1px solid #dbeafe;border-radius:11px;padding:10px}
.wheel small{display:block;color:#64748b;margin-bottom:2px}
.wheel b{font-size:21px}
.section{margin-top:16px}
.section-title{font-size:13px;font-weight:900;color:#334155;margin-bottom:7px}
.rule{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 11px;border-radius:10px;margin-top:7px;background:#f8fafc;border:1px solid #e2e8f0}
.rule .k{font-size:13px;font-weight:800}
.rule .v{font-size:14px;font-weight:950}
.rule.down{background:#fff7f7;border-color:#fecaca}
.rule.down .v{color:#b91c1c}
.rule.up{background:#f0fdf4;border-color:#bbf7d0}
.rule.up .v{color:#166534}
.rule.special{background:#fffaf0;border-color:#fed7aa}
.rule.special .v{color:#9a3412}
.notice{margin-top:12px;padding:10px 11px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;font-weight:800;line-height:1.45}
.compare{margin-top:12px;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.compare-row{display:grid;grid-template-columns:1.45fr 1fr;gap:10px;padding:11px 12px;border-top:1px solid #edf1f5;align-items:center}
.compare-row:first-child{border-top:0}
.compare-row .left{font-size:13px;font-weight:800}
.compare-row .right{text-align:right;font-size:17px;font-weight:950}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.meta .m{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px}
.meta small{display:block;color:#64748b;margin-bottom:2px}
.meta b{font-size:13px}
.hidden{display:none}
.footer{font-size:11px;color:#94a3b8;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>가격 표시 UI 미리보기</h1>
    <p>실제 적용 전 가시성 확인용 · “기준가” 대신 “가격” 사용</p>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="cards"></div>
  <div class="footer">SUNGWOO KASA · v0.1.3 UI preview</div>
</div>

<script>
const samples=[
{
 id:'porter',tab:'포터126',name:'포터Ⅱ · 126 CR',
 tags:['2009년','D4CB'],
 price:'140만원~',
 sub:'탑 / 더블캡 140만원',
 rules:[
  ['오토 감가','-10만원','down'],
  ['활어차 / 물차 감가','-30만원','down'],
  ['엔진불량','100만원','special']
 ],
 meta:[['연식','2009'],['원동기형식','D4CB']]
},
{
 id:'yf',tab:'YF LPG',name:'YF 쏘나타 · LPG',
 tags:['LPG','L4NA'],
 wheels:['140만원','150만원'],
 rules:[['엔진불량','70 / 80만원','special']],
 meta:[['연료','LPG'],['원동기형식','L4NA']]
},
{
 id:'starex',tab:'스타렉스',name:'그랜드 스타렉스 · 승합',
 tags:['2012년','승합'],
 price:'220만원~',
 rules:[['엔진불량','90 / 100만원','special'],['상태 좋은 차량','상담 / 사진필요','special']],
 meta:[['최초등록일','2012-08-03'],['원동기형식','D4CB']]
},
{
 id:'galloper',tab:'갤로퍼',name:'갤로퍼',
 tags:['자동구분 불가'],
 compare:[['전자식','150 / 160만원'],['기계식','190 / 200만원']],
 rules:[['엔진불량','80 / 90만원','special']],
 notice:'전자식 / 기계식은 자동구분하지 않고 두 가격을 함께 표시'
},
{
 id:'matiz',tab:'마티즈',name:'마티즈',
 tags:['세부형 확인'],
 compare:[
  ['일반','40 / 50만원'],
  ['2007.06~크리에이티브 이전','55 / 65만원'],
  ['마티즈 크리에이티브','50 / 60만원']
 ],
 notice:'세부형 자동판정 없이 관련 가격을 모두 표시'
},
{
 id:'hg33',tab:'HG 3.3',name:'그랜저 HG · 3.3',
 tags:['G6DH','3.3 가솔린'],
 price:'가격 확인 필요',
 rules:[['앞사고','-30만원','down'],['엔진불량','80 / 90만원','special']],
 notice:'3.3 엔진 가격표 미등록 · 다른 배기량 가격 자동 대입 안 함',
 meta:[['연료','가솔린'],['원동기형식','G6DH']]
},
{
 id:'sm5',tab:'SM5',name:'SM5',
 tags:['구형/일반 같이 표시'],
 compare:[['구형 518 / 520 / 525','65 / 75만원'],['일반 SM5','80 / 90만원']],
 rules:[['경유','+20만원','up'],['엔진불량','60 / 70만원','special']],
 notice:'구형/일반 자동구분 대신 두 가격을 함께 표시'
}
];

const tabs=document.querySelector('#tabs');
const cards=document.querySelector('#cards');

function renderCard(s){
 let price='';
 if(s.wheels){
   price=`<div class="pricebox"><div class="price-title">가격</div><div class="wheels">
   <div class="wheel"><small>철휠</small><b>${s.wheels[0]}</b></div>
   <div class="wheel"><small>알루미늄</small><b>${s.wheels[1]}</b></div>
   </div></div>`;
 }else if(s.price){
   price=`<div class="pricebox"><div class="price-title">가격</div><div class="price-main">${s.price}</div>${s.sub?`<div style="margin-top:6px;font-size:13px;font-weight:800;color:#475569">${s.sub}</div>`:''}</div>`;
 }

 let compare=s.compare?`<div class="section"><div class="section-title">가격</div><div class="compare">${s.compare.map(x=>`<div class="compare-row"><div class="left">${x[0]}</div><div class="right">${x[1]}</div></div>`).join('')}</div></div>`:'';
 let rules=s.rules?.length?`<div class="section"><div class="section-title">조건 / 특수상태</div>${s.rules.map(x=>`<div class="rule ${x[2]||''}"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>`:'';
 let meta=s.meta?.length?`<div class="meta">${s.meta.map(x=>`<div class="m"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`:'';

 cards.innerHTML=`<div class="card"><div class="topline"><div><div class="name">${s.name}</div><div class="tags">${s.tags.map((x,i)=>`<span class="tag ${i? 'gray':''}">${x}</span>`).join('')}</div></div></div>${price}${compare}${rules}${s.notice?`<div class="notice">⚠ ${s.notice}</div>`:''}${meta}</div>`;
}

samples.forEach((s,i)=>{
 const b=document.createElement('button');
 b.className='tab'+(i===0?' active':'');
 b.textContent=s.tab;
 b.onclick=()=>{
   document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
   b.classList.add('active');
   renderCard(s);
 };
 tabs.appendChild(b);
});
renderCard(samples[0]);
</script>
</body>
</html>
